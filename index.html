<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Jayee Express" />
    <meta name="application-name" content="Jayee Express" />
    <meta name="theme-color" content="#f97316" />
    <meta name="msapplication-TileColor" content="#f97316" />
    <meta name="msapplication-navbutton-color" content="#f97316" />
    <meta name="format-detection" content="telephone=no" />

    <title>Jayee Express — Community Marketplace in Ghana</title>
    <meta name="description" content="Buy and sell goods and services in your community. Set up a store, find local sellers, and shop with delivery across Tamale and Wa on Jayee Express." />
    <meta name="author" content="Jayee Express" />
    <meta name="keywords" content="Jayee Express, Ghana marketplace, Tamale marketplace, Wa marketplace, community marketplace, buy sell Ghana, local stores Ghana, student marketplace" />

    <!-- Sitewide social fallback (per-route Helmet overrides these for JS-aware crawlers) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jayee Express" />
    <meta property="og:title" content="Jayee Express — Community Marketplace in Ghana" />
    <meta property="og:description" content="Buy and sell goods and services in your community. Shop with local delivery across Tamale and Wa." />
    <meta property="og:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/pUKptGpdl1OV5MDWb5P8hRjCVWI2/social-images/social-1781157791512-ChatGPT_Image_May_6,_2026,_03_29_35_PM.webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Jayee Express - Community Marketplace" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jayee Express — Community Marketplace in Ghana" />
    <meta name="twitter:description" content="Buy and sell goods and services in your community. Shop with local delivery across Tamale and Wa." />
    <meta name="twitter:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/pUKptGpdl1OV5MDWb5P8hRjCVWI2/social-images/social-1781157791512-ChatGPT_Image_May_6,_2026,_03_29_35_PM.webp" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-192x192.png" />

    <!-- Organization + WebSite structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Jayee Express",
      "url": "https://jayeeexpress.com",
      "logo": "https://jayeeexpress.com/icons/icon-512x512.png",
      "description": "Community marketplace connecting local buyers and sellers in Ghana.",
      "sameAs": []
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Jayee Express",
      "url": "https://jayeeexpress.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://jayeeexpress.com/products?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <style>
      /* Hide the Lovable badge */
      .lovable-badge,
      #lovable-badge,
      [id*="lovable-badge"],
      [class*="lovable-badge"],
      [id*="lv-badge"],
      [class*="lv-badge"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
